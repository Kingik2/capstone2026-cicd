spring:
  profiles:
    active: local

  datasource:
    username: root
    password: "1234"
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Local - IntelliJ
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mariadb://localhost:3317/user_db

---
# Docker
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mariadb://db:3306/user_db